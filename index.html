<style>
  /* =========================================
     ESTILOS CSS (Diseño y Posicionamiento)
     ========================================= */
  body {
    margin: 0;
    padding: 0;
    background-color: #0b143a; /* Color de fondo por si tarda en cargar la imagen */
  }

  .sgw-contenedor-principal {
    position: relative;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    overflow: hidden;
    padding-bottom: 52%; /* Mantiene la proporción del fondo */
  }

  .sgw-fondo-tablero {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  .sgw-boceto {
    position: absolute;
    width: 40%; 
    cursor: pointer;
    z-index: 2;
    transition: transform 0.4s ease-in-out;
  }

  /* Boceto izquierdo */
  .sgw-boceto-izq {
    top: 15%;
    left: 6%;
    transform: rotate(-8deg);
    transform-origin: 15% 10%; 
  }

  /* Boceto derecho */
  .sgw-boceto-der {
    top: 20%;
    right: 10%;
    transform: rotate(15deg);
    transform-origin: 70% 12%; 
  }
/* Animaciones de balanceo continuo */
  @keyframes balanceo-izq {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(-5deg); }
  }

  @keyframes balanceo-der {
    0%, 100% { transform: rotate(15deg); }
    50% { transform: rotate(12deg); }
  }

  /* Boceto izquierdo */
  .sgw-boceto-izq {
    top: 15%;
    left: 6%;
    transform-origin: 15% 10%; 
    animation: balanceo-izq 4s ease-in-out infinite; 
  }

  /* Boceto derecho */
  .sgw-boceto-der {
    top: 20%;
    right: 8%;
    transform-origin: 80% 12%; 
    animation: balanceo-der 4.5s ease-in-out infinite; /* Tiempo ligeramente distinto para asimetría natural */
  }

  /* Animación al pasar el cursor */
  .sgw-boceto:hover {
    animation: none; /* Detiene el balanceo constante */
    transform: rotate(0deg) scale(1.05); /* Endereza y acerca el boceto */
    z-index: 3;
  }

  .sgw-hoja {
    width: 100%;
    height: auto;
    filter: drop-shadow(5px 10px 8px rgba(0,0,0,0.6));
    display: block;
  }

  .sgw-tachuela {
    position: absolute;
    width: 18%; 
    z-index: 4;
    pointer-events: none; 
  }

  .sgw-tachuela-izq {
    top: 2%;
    left: 8%;
  }

  .sgw-tachuela-der {
    top: 1%;
    right: 12%;
  }
  /* Animación al pasar el cursor */
  .sgw-boceto:hover {
    transform: rotate(0deg) scale(1.05);
    z-index: 3;
  }

  .sgw-hoja {
    width: 100%;
    height: auto;
    filter: drop-shadow(5px 10px 8px rgba(0,0,0,0.6));
    display: block;
  }

  .sgw-tachuela {
    position: absolute;
    width: 18%; 
    z-index: 4;
    pointer-events: none; 
  }

  .sgw-tachuela-izq {
    top: 2%;
    left: 8%;
  }

  .sgw-tachuela-der {
    top: 1%;
    right: 12%;
  }

  /* =========================================
     ESTILOS DEL VISOR (Pantalla completa)
     ========================================= */
  .sgw-visor-oculto {
    display: none;
  }

  .sgw-visor-activo {
    display: flex;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #sgw-imagen-ampliada {
    max-width: 90%;
    max-height: 90vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    border: 5px solid white;
  }

  .sgw-cerrar {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    font-family: sans-serif;
    cursor: pointer;
    font-weight: bold;
  }

  .sgw-cerrar:hover {
    color: #ccc;
  }
</style>

<!-- =========================================
     JAVASCRIPT (Funciones del Visor)
     ========================================= -->
<script>
  function abrirVisor(rutaImagen) {
    var visor = document.getElementById("sgw-visor");
    var imagen = document.getElementById("sgw-imagen-ampliada");
    
    imagen.src = rutaImagen;
    visor.className = "sgw-visor-activo";
    document.body.style.overflow = "hidden"; /* Evita el scroll */
  }

  function cerrarVisor() {
    var visor = document.getElementById("sgw-visor");
    visor.className = "sgw-visor-oculto";
    document.body.style.overflow = "auto"; /* Restaura el scroll */
  }
</script>
